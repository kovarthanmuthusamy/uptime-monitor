# Local production-style stack: PostgreSQL + API + worker.
#   docker compose up --build
# Dashboard: http://localhost:8000   Metrics: http://localhost:8000/metrics
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://uptime:uptime@db:5432/uptime
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build: .
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql+psycopg2://uptime:uptime@db:5432/uptime
      WORKER_TICK_SECONDS: "5"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  db-data:
